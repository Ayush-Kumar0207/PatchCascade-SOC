# =============================================================================
# PatchCascade SOC - OpenEnv Configuration
# =============================================================================
# OpenEnv spec_version 1 compliant configuration.
# Features 5 progressive tasks with multi-dimensional programmatic graders.
# =============================================================================

spec_version: 1
name: patchcascade
type: space
runtime: fastapi
app: server:app
port: 8000

# Environment metadata
display_name: "PatchCascade SOC"
version: "2.0.0"
description: |
  A Security Operations Center (SOC) simulation environment where an agent
  manages vulnerability patches across a network of interdependent servers.
  The agent must balance patching critical vulnerabilities (reducing risk)
  with keeping services online (reducing downtime), while avoiding cascade
  failures caused by dependency violations.
  
  Features 5 progressive difficulty levels forming a curriculum:
  - Easy: Basic patching
  - Medium: Dependency-aware patching
  - Hard: Multi-objective optimization
  - Incident Response: Active breach triage
  - Zero-Day Cascade: Adaptive planning under dynamic threats
  
  Advanced mechanics include exploit spreading, dynamic CVE injection,
  and multi-dimensional grading (completion, efficiency, safety, strategy).

# Author information
author: "Ayush Kumar & Ravi Prashant (PatchCascade SOC Team)"
license: "Apache-2.0"
repository: "https://github.com/Ayush-Kumar0207/PatchCascade-SOC"

# =============================================================================
# Grader Module (programmatic OpenEnv graders)
# =============================================================================
grader_module: grader
grader_class: TaskGrader

# =============================================================================
# Tasks with Graders (5 tasks — exceeding the 3-task minimum)
# =============================================================================
# Each task defines a difficulty level with a multi-dimensional programmatic
# grader that scores agents across 4 dimensions: completion, efficiency,
# safety, and strategy. Scores are normalized to [0.0, 1.0].
tasks:
  - id: easy
    name: "Easy Mode"
    description: "3-5 nodes, no dependencies, 1 vulnerability. Beginner-friendly scenario for learning basic patch mechanics."
    max_turns: 30
    difficulty: 1
    has_grader: true
    grader:
      type: programmatic
      module: grader
      class: EasyGrader
      function: grade
      description: "Multi-dimensional grader — completion (40%), efficiency (20%), safety (20%), strategy (20%)"
      success_threshold: 0.5
      scoring:
        method: multi_dimensional
        dimensions: [completion, efficiency, safety, strategy]
        weights: {completion: 0.40, efficiency: 0.20, safety: 0.20, strategy: 0.20}
        formula: "score = 0.40*completion + 0.20*efficiency + 0.20*safety + 0.20*strategy"
      success_criteria:
        all_vulnerabilities_patched: true
        no_catastrophic_failures: true

  - id: medium
    name: "Medium Mode"
    description: "5-8 nodes, linear dependency chain (Web→App→DB), 2 vulnerabilities. Requires suspend-patch-resume workflow for Tier 1 nodes."
    max_turns: 50
    difficulty: 2
    has_grader: true
    grader:
      type: programmatic
      module: grader
      class: MediumGrader
      function: grade
      description: "Multi-dimensional grader — completion (40%), efficiency (20%), safety (20%), strategy (20%)"
      success_threshold: 0.6
      scoring:
        method: multi_dimensional
        dimensions: [completion, efficiency, safety, strategy]
        weights: {completion: 0.40, efficiency: 0.20, safety: 0.20, strategy: 0.20}
        formula: "score = 0.40*completion + 0.20*efficiency + 0.20*safety + 0.20*strategy"
      success_criteria:
        all_vulnerabilities_patched: true
        no_catastrophic_failures: true
        respect_dependencies: true

  - id: hard
    name: "Hard Mode"
    description: "10-15 nodes, complex dependency graph (LB→Web→App→DB+Auth), 5 vulnerabilities (2 actively exploited). Expert-level multi-objective optimization."
    max_turns: 100
    difficulty: 3
    has_grader: true
    grader:
      type: programmatic
      module: grader
      class: HardGrader
      function: grade
      description: "Multi-dimensional grader — completion (40%), efficiency (20%), safety (20%), strategy (20%)"
      success_threshold: 0.7
      scoring:
        method: multi_dimensional
        dimensions: [completion, efficiency, safety, strategy]
        weights: {completion: 0.40, efficiency: 0.20, safety: 0.20, strategy: 0.20}
        formula: "score = 0.40*completion + 0.20*efficiency + 0.20*safety + 0.20*strategy"
      success_criteria:
        all_vulnerabilities_patched: true
        no_catastrophic_failures: true
        respect_dependencies: true
        minimize_downtime: true

  - id: incident_response
    name: "Incident Response"
    description: "Active breach scenario: 8 nodes (2 pre-crashed), 3 vulnerabilities (2 exploited), exploit spreading mechanic. Tests triage, recovery, and threat containment under pressure."
    max_turns: 60
    difficulty: 4
    has_grader: true
    grader:
      type: programmatic
      module: grader
      class: IncidentResponseGrader
      function: grade
      description: "Safety-focused multi-dimensional grader — completion (30%), efficiency (15%), safety (35%), strategy (20%)"
      success_threshold: 0.5
      scoring:
        method: multi_dimensional
        dimensions: [completion, efficiency, safety, strategy]
        weights: {completion: 0.30, efficiency: 0.15, safety: 0.35, strategy: 0.20}
        formula: "score = 0.30*completion + 0.15*efficiency + 0.35*safety + 0.20*strategy"
      success_criteria:
        all_vulnerabilities_patched: true
        all_crashed_nodes_recovered: true
        no_additional_cascade_failures: true
        exploit_spreading_contained: true

  - id: zero_day
    name: "Zero-Day Cascade"
    description: "Dynamic threat injection: 10 nodes, 2 initial + 2 dynamically injected CVEs (at turns 5 and 15). Tests adaptive planning and strategy revision under evolving threat conditions."
    max_turns: 80
    difficulty: 5
    has_grader: true
    grader:
      type: programmatic
      module: grader
      class: ZeroDayGrader
      function: grade
      description: "Efficiency-focused multi-dimensional grader — completion (35%), efficiency (30%), safety (15%), strategy (20%)"
      success_threshold: 0.6
      scoring:
        method: multi_dimensional
        dimensions: [completion, efficiency, safety, strategy]
        weights: {completion: 0.35, efficiency: 0.30, safety: 0.15, strategy: 0.20}
        formula: "score = 0.35*completion + 0.30*efficiency + 0.15*safety + 0.20*strategy"
      success_criteria:
        all_vulnerabilities_patched: true
        no_catastrophic_failures: true
        dynamic_cves_handled: true
        strategy_adapted: true

# =============================================================================
# Evaluation Configuration
# =============================================================================
evaluation:
  default_task: "medium"
  metrics:
    - name: "composite_score"
      description: "Weighted multi-dimensional score (completion, efficiency, safety, strategy)"
      higher_is_better: true
      primary: true
    - name: "completion_score"
      description: "Fraction of vulnerabilities successfully patched"
      higher_is_better: true
    - name: "efficiency_score"
      description: "Steps taken relative to theoretical optimum"
      higher_is_better: true
    - name: "safety_score"
      description: "Cascade failures avoided, no catastrophic events"
      higher_is_better: true
    - name: "strategy_score"
      description: "Quality of decision-making: exploit prioritization, dependency ordering"
      higher_is_better: true

# =============================================================================
# Dynamic Events (Advanced Mechanics)
# =============================================================================
dynamic_events:
  exploit_spreading:
    description: |
      Actively exploited vulnerabilities (exploit_in_wild=true) spread to
      connected nodes after a threshold number of turns. Creates urgency
      for prioritizing exploited CVEs.
    applies_to: [hard, incident_response, zero_day]
    threshold_turns: 3
    
  zero_day_injection:
    description: |
      New CVEs are dynamically injected at predefined turns (5 and 15),
      forcing the agent to adapt its strategy mid-episode.
    applies_to: [zero_day]
    injection_turns: [5, 15]
    
  stochastic_degradation:
    description: |
      Nodes with unpatched exploited vulnerabilities have a 3% chance per
      turn to experience stress-induced crashes. Models real-world uncertainty
      where compromised systems may fail unpredictably.
    applies_to: [hard, incident_response]
    probability: 0.03

# =============================================================================
# Reward Structure
# =============================================================================
rewards:
  type: dense
  description: |
    Dense reward shaping based on penalty reduction with time pressure.
    Reward = (Previous Turn's Total Penalty) - (Current Turn's Total Penalty) - 0.1
    
    The -0.1 per-turn time pressure ensures every step produces non-zero
    reward, incentivizing efficient action sequences.
    
    Penalty Components:
    - Risk Penalty: Sum of CVSS scores for vulns on ONLINE nodes (doubled if exploit_in_wild)
    - Downtime Penalty: Per non-ONLINE node, weighted by tier (Tier1=3x, Tier2=2x, Tier3=1x)
    - Crashed nodes have doubled downtime penalty
    
    Terminal Bonuses:
    - Victory (all patched): +50.0
    - Catastrophic failure (all crashed): -100.0
    - Invalid action: -0.5
    - Time pressure: -0.1 per turn (ensures dense signal)
    
    Normalization:
    - MIN_REWARD: -300.0 (catastrophic failure ceiling)
    - MAX_REWARD: 50.0 (perfect victory)
    - Normalized Score = (total_reward - MIN) / (MAX - MIN), clamped to [0, 1]

# =============================================================================
# Action/Observation Schemas
# =============================================================================
action_schema:
  type: "object"
  properties:
    action_type:
      type: "string"
      enum: ["scan_host", "suspend_service", "apply_patch", "resume_service", "noop"]
    target:
      type: "string"
      description: "Hostname of target server"
    cve_id:
      type: "string"
      pattern: "^CVE-\\d{4}-\\d{4,}$"
      description: "Required for apply_patch action"
    reason:
      type: "string"
      description: "Optional reasoning for the action"
  required: ["action_type"]

observation_schema:
  type: "object"
  properties:
    nodes:
      type: "array"
      description: "List of server nodes with state information"
    vulnerabilities:
      type: "array"
      description: "List of active CVEs to patch"
    dependencies:
      type: "array"
      description: "Dependency graph edges"
    health:
      type: "object"
      description: "Aggregate network health metrics"
    last_action_result:
      type: "string"
      description: "Result of the previous action"
    messages:
      type: "array"
      description: "System messages for the current turn"

# =============================================================================
# Tags for Discoverability
# =============================================================================
tags:
  - openenv
  - security
  - network-management
  - dependency-graph
  - dynamic-events
  - exploit-spreading
  - zero-day-simulation
  - turn-based
  - json-observation
  - json-action
  - llm-agent
  - multi-dimensional-grading
