# =============================================================================
# PatchCascade SOC - OpenEnv Configuration
# =============================================================================
# OpenEnv spec_version 1 compliant configuration for the Meta PyTorch Hackathon.
# =============================================================================

spec_version: 1
name: patchcascade
type: space
runtime: fastapi
app: server:app
port: 8000

# Environment metadata
display_name: "PatchCascade SOC"
version: "1.0.0"
description: |
  A Security Operations Center (SOC) simulation environment where an agent
  manages vulnerability patches across a network of interdependent servers.
  The agent must balance patching critical vulnerabilities (reducing risk)
  with keeping services online (reducing downtime), while avoiding cascade
  failures caused by dependency violations.

# Author information
author: "Ayush Kumar & Ravi Prashant (PatchCascade SOC Team)"
license: "Apache-2.0"
repository: "https://github.com/Ayush-Kumar0207/PatchCascade-SOC"

# =============================================================================
# Grader Module (Required for hackathon: programmatic graders)
# =============================================================================
grader_module: grader
grader_class: TaskGrader

# =============================================================================
# Tasks with Graders (Required for hackathon: at least 3 tasks with graders)
# =============================================================================
# Each task defines a difficulty level with an associated programmatic grader
# that computes a normalized score (0.0-1.0) based on agent performance.
tasks:
  - id: easy
    name: "Easy Mode"
    description: "3-5 nodes, no dependencies, 1 vulnerability. Beginner-friendly scenario."
    max_turns: 30
    difficulty: 1
    has_grader: true
    grader:
      type: programmatic
      module: grader
      class: EasyGrader
      function: grade
      description: "Programmatic grader — normalized cumulative reward"
      success_threshold: 0.5
      scoring:
        method: normalized_reward
        min_reward: -300.0
        max_reward: 50.0
        formula: "(total_reward - min_reward) / (max_reward - min_reward)"
      success_criteria:
        all_vulnerabilities_patched: true
        no_catastrophic_failures: true

  - id: medium
    name: "Medium Mode"
    description: "5-8 nodes, linear dependency chain, 2 vulnerabilities. Requires dependency awareness."
    max_turns: 50
    difficulty: 2
    has_grader: true
    grader:
      type: programmatic
      module: grader
      class: MediumGrader
      function: grade
      description: "Programmatic grader — normalized cumulative reward"
      success_threshold: 0.6
      scoring:
        method: normalized_reward
        min_reward: -300.0
        max_reward: 50.0
        formula: "(total_reward - min_reward) / (max_reward - min_reward)"
      success_criteria:
        all_vulnerabilities_patched: true
        no_catastrophic_failures: true
        respect_dependencies: true

  - id: hard
    name: "Hard Mode"
    description: "10-15 nodes, complex dependency graph, multiple critical vulnerabilities. Expert level."
    max_turns: 100
    difficulty: 3
    has_grader: true
    grader:
      type: programmatic
      module: grader
      class: HardGrader
      function: grade
      description: "Programmatic grader — normalized cumulative reward"
      success_threshold: 0.7
      scoring:
        method: normalized_reward
        min_reward: -300.0
        max_reward: 50.0
        formula: "(total_reward - min_reward) / (max_reward - min_reward)"
      success_criteria:
        all_vulnerabilities_patched: true
        no_catastrophic_failures: true
        respect_dependencies: true
        minimize_downtime: true

# =============================================================================
# Evaluation Configuration
# =============================================================================
evaluation:
  default_task: "medium"
  metrics:
    - name: "normalized_score"
      description: "Normalized reward score (0.0-1.0)"
      higher_is_better: true
      primary: true
    - name: "success_rate"
      description: "Percentage of episodes where all vulnerabilities are patched"
      higher_is_better: true
    - name: "steps_to_completion"
      description: "Number of steps taken to complete (lower is better)"
      higher_is_better: false
    - name: "cascade_failures"
      description: "Total nodes crashed due to dependency violations"
      higher_is_better: false

# =============================================================================
# Reward Structure
# =============================================================================
rewards:
  type: dense
  description: |
    Dense reward shaping based on penalty reduction.
    Reward = (Previous Turn's Total Penalty) - (Current Turn's Total Penalty)
    
    Penalty Components:
    - Risk Penalty: Sum of CVSS scores for vulns on ONLINE nodes (doubled if exploit_in_wild)
    - Downtime Penalty: Per non-ONLINE node, weighted by tier (Tier1=3x, Tier2=2x, Tier3=1x)
    - Crashed nodes have doubled downtime penalty
    
    Terminal Bonuses:
    - Victory (all patched): +50.0
    - Catastrophic failure (all crashed): -100.0
    - Invalid action: -0.5
    
    Normalization:
    - MIN_REWARD: -300.0 (catastrophic failure ceiling)
    - MAX_REWARD: 50.0 (perfect victory)
    - Normalized Score = (total_reward - MIN) / (MAX - MIN), clamped to [0, 1]

# =============================================================================
# Action/Observation Schemas
# =============================================================================
action_schema:
  type: "object"
  properties:
    action_type:
      type: "string"
      enum: ["scan_host", "suspend_service", "apply_patch", "resume_service", "noop"]
    target:
      type: "string"
      description: "Hostname of target server"
    cve_id:
      type: "string"
      pattern: "^CVE-\\d{4}-\\d{4,}$"
      description: "Required for apply_patch action"
    reason:
      type: "string"
      description: "Optional reasoning for the action"
  required: ["action_type"]

observation_schema:
  type: "object"
  properties:
    nodes:
      type: "array"
      description: "List of server nodes with state information"
    vulnerabilities:
      type: "array"
      description: "List of active CVEs to patch"
    dependencies:
      type: "array"
      description: "Dependency graph edges"
    health:
      type: "object"
      description: "Aggregate network health metrics"
    last_action_result:
      type: "string"
      description: "Result of the previous action"
    messages:
      type: "array"
      description: "System messages for the current turn"

# =============================================================================
# Tags for Discoverability
# =============================================================================
tags:
  - openenv
  - security
  - network-management
  - dependency-graph
  - turn-based
  - json-observation
  - json-action
  - llm-agent
  - hackathon
